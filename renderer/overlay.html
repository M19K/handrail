<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self';">
<title>Handrail</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>

<!--
  The entire overlay. One window, three states, two side panels.

  This replaces four separate renderer windows (index, chat, llmResponse,
  settings) that each had their own lifecycle, their own copy of the styling and
  their own IPC listeners. See docs/IPC.md.

  Markup for every state is present and toggled with [hidden] rather than being
  built at runtime — the overlay changes state often and constantly, and
  rebuilding the DOM on each transition is how you get flicker over somebody
  else's screen.
-->
<div id="app">

  <!-- ===================== COLLAPSED ===================== -->
  <button id="pill" class="pill" hidden aria-label="Open Handrail">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 9h11.5c3 0 4.5 1.6 4.5 4.5V20" stroke="currentColor" stroke-opacity="0.45"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle id="pill-grip" cx="7.5" cy="9" r="3.8" fill="#2FD9A8"/>
    </svg>
    <span class="pill__label">Handrail</span>
    <span class="pill__hint" id="pill-hint">Ctrl ⇧ H</span>
  </button>

  <!-- ===================== DOCK: side panels + main column ===================== -->
  <div class="dock" id="dock" hidden>

    <!-- ---------- Threads ---------- -->
    <aside class="side" id="panel-threads" hidden>
      <div class="side__head">
        <h2>Threads</h2>
        <button class="icon-btn" id="thread-new" aria-label="New thread" title="New thread">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <input class="side__search" id="thread-search" type="search" placeholder="Search threads…" autocomplete="off">
      <div class="side__body" id="thread-list"></div>
    </aside>

    <!-- ---------- Settings ---------- -->
    <aside class="side" id="panel-settings" hidden>
      <div class="side__head"><h2>Settings</h2></div>
      <div class="side__body" id="settings-body"></div>
    </aside>

    <!-- ---------- Main column ---------- -->
    <div class="column">

      <!-- ---------- The bar ---------- -->
      <form class="bar" id="bar" hidden>
        <!-- Brand. Draggable as well as the grip: people reach for the name of
             a window before they look for a handle. -->
        <span class="brand" id="brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 9h11.5c3 0 4.5 1.6 4.5 4.5V20" stroke="currentColor" stroke-opacity="0.45"
                  stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8" cy="9" r="3.4" fill="#2FD9A8"/>
          </svg>
          <span class="brand__name">Handrail</span>
        </span>

        <input class="bar__input" id="input" type="text" autocomplete="off" spellcheck="false"
               placeholder="What are you trying to do?" aria-label="Ask Handrail">

        <!-- Swapped for the capture flash / thinking dots while a turn runs -->
        <div class="bar__tools" id="tools">
          <button type="button" class="tool" id="toggle-capture" aria-pressed="true"
                  aria-label="Capture my screen" title="Capture my screen">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="6" width="18" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12.5" r="3.2" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
          <button type="button" class="tool" id="toggle-web" aria-pressed="false"
                  aria-label="Look things up on the web" title="Look things up on the web">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"
                    stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="tool" id="attach"
                  aria-label="Attach a file to this thread" title="Attach a file">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21 11.5l-8.6 8.6a5 5 0 01-7.1-7.1l9-9a3.4 3.4 0 014.8 4.8l-8.9 8.9a1.8 1.8 0 01-2.5-2.5l8.2-8.2"
                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" class="tool" id="toggle-threads" aria-pressed="false"
                  aria-label="Threads" title="Threads">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="tool" id="toggle-settings" aria-pressed="false"
                  aria-label="Settings" title="Settings">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="rule-v"></span>
          <!-- A real submit button, not a decorative key cap. It looked
               clickable, so it had to be clickable. -->
          <button type="submit" class="kbd kbd--send" id="send"
                  aria-label="Send" title="Send">⏎</button>
        </div>

        <!-- Re-open the conversation that was just collapsed.
             Collapsing used to be an X: it hid the transcript and the only way
             back was the Threads panel, two clicks away, to re-select a thread
             that was never actually closed. This is the other half of that
             toggle and it is hidden until there is something to come back to. -->
        <button type="button" class="tool" id="expand-thread" hidden
                aria-label="Show the conversation" title="Show the conversation">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Attachments carried by this thread, shown as removable chips. -->
        <span class="attachments" id="attachments" hidden></span>

        <!-- Drag handle. Four columns rather than two: this is a target people
             have to hit while the window is floating over something else, and
             the old one was too small to grab reliably. -->
        <span class="grip" id="grip" title="Drag to move">
          <span class="grip__row">
            <i class="grip__dot"></i><i class="grip__dot"></i><i class="grip__dot"></i><i class="grip__dot"></i>
          </span>
          <span class="grip__row">
            <i class="grip__dot"></i><i class="grip__dot"></i><i class="grip__dot"></i><i class="grip__dot"></i>
          </span>
          <span class="grip__row">
            <i class="grip__dot"></i><i class="grip__dot"></i><i class="grip__dot"></i><i class="grip__dot"></i>
          </span>
        </span>

        <!-- Quit, at the far right where a close control belongs. Without this
             the only way out was Task Manager: the window is frameless,
             skipTaskbar, and has no menu. A tray item exists too, but the
             control you can see beats the one you have to find. -->
        <button type="button" class="tool tool--quit" id="quit"
                aria-label="Quit Handrail" title="Quit Handrail">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>

        <span class="capture-flash" id="capture-flash" hidden>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Screen captured
        </span>

        <span class="thinking" id="thinking" hidden><i></i><i></i><i></i></span>
      </form>

      <!-- ---------- Conversation ----------
           A running transcript, not a single answer. Every prompt stays on
           screen above its reply, the list scrolls, and it keeps growing as the
           conversation does. Messages are appended by overlay.js; nothing in
           here is replaced between turns. -->
      <section class="panel" id="panel" hidden>
        <header class="panel__head">
          <h1 class="panel__title" id="panel-title">Handrail</h1>
          <span class="chip" id="panel-progress" hidden></span>
          <button type="button" class="icon-btn" id="panel-clear"
                  aria-label="Start a new thread" title="Start a new thread">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </button>
          <!-- A chevron, not an X. An X reads as "close this and lose it", and
               the old behaviour matched: the thread stayed open underneath but
               getting back to it meant going through the Threads panel. Up
               collapses to the bar, and the matching down chevron in the bar
               brings this exact thread back in one click. -->
          <button type="button" class="icon-btn" id="panel-close"
                  aria-label="Collapse the conversation" title="Collapse">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </header>

        <div class="panel__body" id="panel-body" aria-live="polite" role="log"></div>
      </section>

    </div>
  </div>
</div>

<!-- Dev harness only, and NOT packaged — see scripts/package-win.js and the
     electron-builder `files` list. In a shipped build this 404s and that is
     correct: a mock bridge in production means a failed preload looks like a
     working app full of invented data. -->
<script src="mock-bridge.js"></script>
<script src="overlay.js"></script>
</body>
</html>
