# Build installers for every platform and attach them to a GitHub Release.
#
# Why CI rather than a local build: electron-builder cannot run on the author's
# Windows machine (extracting its winCodeSign toolchain creates symlinks, which
# Windows refuses without Developer Mode), and building a macOS .dmg needs a Mac.
# GitHub's runners have both problems solved for free, so the release path lives
# here and `scripts/package-win.js` stays as the local Windows fallback.
#
# Triggered by pushing a tag: `git tag v0.1.0 && git push --tags`.
#
# EVERY RELEASE SHIPS EVERY PLATFORM. v0.1.4 went out with only the two macOS
# `.dmg` files, because it was published by hand from a Mac while this workflow
# was cancelled. A Windows user opening the latest release found nothing they
# could run and no reason given. Cut releases by pushing a tag and letting this
# build both halves; do not publish hand-built artifacts for one platform.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # so a build can be tried without cutting a tag

permissions:
  contents: write             # needed to create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false        # a macOS failure should not bin the Windows build
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runs on both platforms. No Electron and no display needed — the unit
      # tests are deliberately pure so they can gate a release.
      - name: Unit tests
        run: npm test

      - name: Build installers
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Unsigned on purpose for now. Without this electron-builder hunts for
          # a certificate in the keychain and fails the build when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # The only check that runs the PACKAGED bundle rather than the repo.
      # Four releases shipped a macOS .dmg that could not open a window while
      # every suite above was green, because every suite above executes the
      # source tree. A never-opened artifact must not leave CI again.
      - name: Verify the packaged macOS app starts
        if: matrix.platform == 'mac'
        run: node scripts/verify-mac-build.js

      - uses: actions/upload-artifact@v4
        with:
          name: handrail-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true          # a human checks the notes before it goes public
          generate_release_notes: true
          body: |
            ## Installing

            **Windows** — download the `.exe`. It is unsigned, so SmartScreen
            will warn on first run: click **More info** then **Run anyway**.

            **macOS** — download the `.dmg`. It is unsigned, so Gatekeeper will
            refuse it on first open. Right-click the app → **Open** → **Open
            Anyway**. On macOS 15 and later: System Settings → Privacy &
            Security → **Open Anyway**.

            Signing costs $99/year per platform and is not in place yet. Until
            it is, those two steps are unavoidable — see PLATFORM.md.

            You will need an API key from OpenRouter, OpenAI or Anthropic.
            Onboarding asks for one and works out which is which from the key.
